version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: postgres-course-ocean
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - my_network

  redis:
    image: redis:latest
    container_name: redis-course-ocean
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - my_network

volumes:
  postgres_data:
  redis_data:

networks:
  my_network:
    driver: bridge